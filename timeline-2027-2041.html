:root{--bg:#faf9f6;--ink:#1c1c1a;--mute:#6f6d67;--line:#dcd9d1;--soft:#f1efe9}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--ink:#ecebe6;--mute:#a09e95;--line:#34332f;--soft:#1e1d1b}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Asap",system-ui,sans-serif;font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:680px;margin:0 auto;padding:0 24px}
header{padding:72px 0 28px}
h1{font-weight:400;font-size:clamp(2.2rem,7vw,3.2rem);letter-spacing:-.02em;margin:0;line-height:1.05}
header p{margin:10px 0 0;color:var(--mute);letter-spacing:.08em;font-size:.85rem}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:4px}
svg{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}

.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 0 10px}
.filters{display:flex;flex-wrap:wrap;gap:6px 18px}
.filters button{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--mute);padding:4px 0;border-bottom:1px solid transparent}
.filters svg{width:18px;height:18px}
.filters button[aria-pressed=true]{color:var(--ink);border-bottom-color:var(--ink)}
.rail{display:flex;justify-content:space-between;margin-top:12px}
.rail button{flex:1;font-size:.72rem;color:var(--mute);padding:6px 0 2px;position:relative;font-variant-numeric:tabular-nums}
.rail button::before{content:"";display:block;width:5px;height:5px;border-radius:50%;border:1px solid var(--mute);margin:0 auto 5px;transition:transform .2s}
.rail button[aria-current=true]{color:var(--ink)}
.rail button[aria-current=true]::before{background:var(--ink);border-color:var(--ink);transform:scale(1.5)}

ol,ul{list-style:none;margin:0;padding:0}
.years{padding:20px 0 96px}
.year{display:grid;grid-template-columns:108px 1fr;scroll-margin-top:120px;transition:opacity .2s}
.year.quiet{opacity:.35}
.yr{padding:22px 0;font-size:1.5rem;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.yr small{display:block;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:400;margin-top:4px;line-height:1.3}
.items{border-left:1px solid var(--line);padding:18px 0 18px 26px;position:relative;min-height:76px}
.items::before{content:"";position:absolute;left:-4px;top:33px;width:7px;height:7px;border-radius:50%;background:var(--bg);border:1px solid var(--ink)}
.item button{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:8px 0}
.item .t{flex:1}
.item .plus{color:var(--mute);font-weight:300;transition:transform .2s}
.item button[aria-expanded=true] .plus{transform:rotate(45deg)}
.item .d{margin:0 0 8px 36px;color:var(--mute);font-size:.9rem}
.item[hidden]{display:none}
footer{border-top:1px solid var(--line);padding:20px 0 56px;color:var(--mute);font-size:.8rem;display:flex;justify-content:space-between;gap:16px}
footer button{text-decoration:underline;text-underline-offset:3px}
@media (max-width:520px){.year{grid-template-columns:68px 1fr}.yr{font-size:1.2rem}.items{padding-left:18px}.rail button{font-size:.6rem}}
@media print{.bar,footer button{display:none}.item .d{display:block!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Fifteen years</h1>
    <p>2027 — 2041</p>
  </header>
</div>
<div class="bar"><div class="wrap">
  <div class="filters" id="filters" role="group" aria-label="Show"></div>
  <nav class="rail" id="rail" aria-label="Jump to year"></nav>
</div></div>
<main class="wrap">
  <ol class="years" id="years"></ol>
  <footer><span>~ marks an approximate year</span><button id="all" aria-pressed="false">Open all</button></footer>
</main>

<script>
const ICON={
 all:'<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="1"/>',
 book:'<path d="M4 5.5c2.5-1 5.5-1 8 .5 2.5-1.5 5.5-1.5 8-.5v13c-2.5-1-5.5-1-8 .5-2.5-1.5-5.5-1.5-8-.5z"/><path d="M12 6v13"/>',
 cap:'<path d="M2.5 9.5 12 5l9.5 4.5L12 14z"/><path d="M6.5 11.8V16c1.6 1.4 3.4 2 5.5 2s3.9-.6 5.5-2v-4.2M21.5 9.5V15"/>',
 case:'<rect x="3.5" y="7.5" width="17" height="12" rx="1.5"/><path d="M9 7.5v-2h6v2M3.5 13h17"/>',
 send:'<path d="M21 3 10 14M21 3l-7 18-4-7-7-4z"/>',
 seal:'<circle cx="12" cy="9.5" r="5.5"/><path d="M8.5 14 7 21l5-2.5 5 2.5-1.5-7"/>',
 door:'<path d="M6.5 21V4.5h11V21M3.5 21h17"/><path d="M14.3 12.5h.01"/>',
 brush:'<path d="M9.5 15.5 19 4.5l1.5 1.5-9.5 11"/><path d="M4 20c0-2.6 1-4.2 3-4.2s3 1.2 3 2.7c0 1.2-2 1.9-6 1.5z"/>',
 sprout:'<path d="M12 21v-9"/><path d="M12 12c0-3.5-2.5-6-7-6 0 4 2.5 6 7 6z"/><path d="M12 15c0-3 2.2-5 6.5-5 0 3.5-2.2 5-6.5 5z"/>',
 globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',
 people:'<circle cx="8.5" cy="9" r="2.5"/><circle cx="16.5" cy="9.5" r="2"/><path d="M3.5 19c.5-3 2.4-4.5 5-4.5s4.5 1.5 5 4.5M15.5 15c2.6 0 4.3 1.3 5 4"/>',
 board:'<rect x="4" y="4.5" width="16" height="11" rx="1"/><path d="M12 15.5V20M8.5 20h7"/>',
 flag:'<path d="M6 21V4M6 4.5h11l-2.5 4 2.5 4H6"/>',
 key:'<circle cx="8" cy="15.5" r="3.5"/><path d="M10.5 13 19 4.5M16 7.5l2.5 2.5M13.5 10l2 2"/>',
 mountain:'<path d="M3 19l6-10 4 6 2.5-3.5L21 19z"/>',
 tree:'<path d="M12 21v-5M12 3 7 10h3l-4 6h12l-4-6h3z"/>',
 cross:'<path d="M9.5 4h5v5.5H20v5h-5.5V20h-5v-5.5H4v-5h5.5z"/>',
 buoy:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5"/><path d="m5.6 5.6 3.9 3.9M14.5 14.5l3.9 3.9M18.4 5.6l-3.9 3.9M9.5 14.5l-3.9 3.9"/>',
 peak:'<path d="M3 20 10 9l7 11zM14.5 16l2-3 4.5 7h-4"/><path d="M10 9V4l3 1.2-3 1.3"/>',
 chairs:'<path d="M5 20v-6h5v6M5 14V7M19 20v-6h-5v6M19 14V7"/>'
};
const LANES=[['all','All','all'],['study','Study','book'],['work','Work','case'],['practice','Practice','chairs'],['art','Art','brush'],['nature','Nature','mountain'],['money','Money','sprout']];
const STAGE={2027:'Access & Frame',2031:'The Room',2035:'The Question'};
// [year, lane, icon, title, detail]
const M=[
 [2027,'work','case','Inclusive learning design role','Next full-time role. ~'],
 [2027,'work','people','Colleagues join Accessible Learning Labs',''],
 [2027,'study','book','Leeds MSc begins','Disability Studies, Rights and Inclusion. September.'],
 [2028,'study','flag','Applied Project runway complete','Ready at week one. 31 August.'],
 [2028,'practice','people','Peer support certification','Peer Support Canada. Make Space. ~'],
 [2029,'study','cap','Leeds MSc complete','Paid in cash.'],
 [2029,'work','case','Accessibility Advisor','UBC or SFU. ~'],
 [2030,'study','send','Counselling MA applications','UBC, SFU and CGRS M. 1 December. Prerequisites graded by 31 December.'],
 [2031,'study','book','Counselling MA begins','Thesis route. September.'],
 [2032,'practice','chairs','Practicum','University counselling services. ~'],
 [2033,'study','flag','MA thesis','Built on the Leeds Applied Project.'],
 [2034,'study','cap','Counselling MA complete','~'],
 [2034,'practice','seal','RCC registration','~'],
 [2034,'practice','door','Therapeutic Studio opens','Private practice. ~'],
 [2034,'work','case','Counselling role','UBC or SFU. ~'],
 [2035,'practice','seal','Art therapy diploma','VATI Advanced Diploma, 2034–35. ~'],
 [2035,'study','book','UBC PhD begins','Counselling Psychology. Funded. ~'],
 [2039,'study','chairs','Pre-doctoral internship','1,600 hours. ~'],
 [2040,'study','cap','PhD complete','~'],
 [2040,'practice','key','Registered psychologist','British Columbia. ~'],
 [2040,'study','globe','Global mental health postdoc','2040–42. ~'],
 [2041,'work','board','Adjunct professor','Beside a counselling psychology role.'],
 [2041,'work','board','UBC Lecturer, teaching stream','Psychology.'],
 [2041,'practice','door','Practice and Creative Health program','Therapeutic Studio.'],,
 [2027,'art','brush','150 studies sold','Andrea Robin Studio.'],
 [2027,'nature','mountain','Movement regimen, year one','Stabilise, build, integrate. Rowing, trail running, climbing. ~'],
 [2027,'money','sprout','Debt cleared','July.'],
 [2028,'art','board','Foundations teaching module','Taught from the studio.'],
 [2028,'nature','cross','Wilderness First Responder','~'],
 [2028,'nature','people','Nature ritual community','~'],
 [2028,'money','sprout','$100K invested','Income doubled. Emergency fund full.'],
 [2029,'nature','tree','Forest therapy credential','~'],
 [2030,'art','door','Two curated exhibitions','Opens arts council funding. ~'],
 [2030,'nature','buoy','Wilderness rescue team','~'],
 [2031,'nature','peak','First skyrace','~'],
 [2033,'money','sprout','$1M invested','~'],
 [2035,'art','flag','Dear Ordinary, first major showing','~'],
 [2036,'money','sprout','$1.8M invested','Ten-year picture. ~'],
 [2038,'money','flag','Chosen work','$2.5M reached. Every role taken for meaning and fit. ~'],
 [2041,'art','brush','Studio at its largest','Andrea Robin Studio.'],
 [2041,'nature','mountain','Sustained for life','Emphasis shifts with each decade.']
];
const svg=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;
const $=id=>document.getElementById(id);
let lane='all';

$('filters').innerHTML=LANES.map(([k,l,i])=>`<button data-lane="${k}" aria-pressed="${k==='all'}">${svg(i)}${l}</button>`).join('');
let rail='',html='';
for(let y=2027;y<=2041;y++){
  rail+=`<button data-y="${y}" aria-label="${y}">’${String(y).slice(2)}</button>`;
  const items=M.filter(m=>m[0]===y).map((m,i)=>{
    const approx=m[4].endsWith('~'),d=m[4].replace(/\s*~$/,'');
    const id=`d${y}-${i}`;
    return `<li class="item" data-lane="${m[1]}"><button aria-expanded="false" aria-controls="${id}"${d?'':' disabled style="cursor:default"'}>${svg(m[2])}<span class="t">${approx?'<span aria-label="approximately">~ </span>':''}${m[3]}</span>${d?'<span class="plus" aria-hidden="true">+</span>':''}</button><p class="d" id="${id}" hidden>${d}</p></li>`;
  }).join('');
  html+=`<li class="year" id="y${y}"><div class="yr">${y}${STAGE[y]?`<small>${STAGE[y]}</small>`:''}</div><ul class="items">${items}</ul></li>`;
}
$('rail').innerHTML=rail;$('years').innerHTML=html;

function applyFilter(){
  document.querySelectorAll('.filters button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lane===lane));
  document.querySelectorAll('.year').forEach(y=>{
    let n=0;
    y.querySelectorAll('.item').forEach(it=>{const show=lane==='all'||it.dataset.lane===lane;it.hidden=!show;if(show)n++;});
    y.classList.toggle('quiet',n===0);
  });
}
$('filters').addEventListener('click',e=>{const b=e.target.closest('button');if(b){lane=b.dataset.lane;applyFilter();}});
function toggle(btn,open){
  const p=document.getElementById(btn.getAttribute('aria-controls'));
  if(btn.disabled||!p)return;
  btn.setAttribute('aria-expanded',open);p.hidden=!open;
}
$('years').addEventListener('click',e=>{const b=e.target.closest('.item button');if(b)toggle(b,b.getAttribute('aria-expanded')!=='true');});
$('all').addEventListener('click',e=>{
  const open=e.target.getAttribute('aria-pressed')!=='true';
  e.target.setAttribute('aria-pressed',open);e.target.textContent=open?'Close all':'Open all';
  document.querySelectorAll('.item button').forEach(b=>toggle(b,open));
});
$('rail').addEventListener('click',e=>{const b=e.target.closest('button');if(b)$('y'+b.dataset.y).scrollIntoView({block:'start'});});
function mark(y){document.querySelectorAll('.rail button').forEach(b=>b.setAttribute('aria-current',b.dataset.y==y));}
mark(2027);
if('IntersectionObserver' in window){
  const io=new IntersectionObserver(es=>{es.forEach(en=>{if(en.isIntersecting)mark(en.target.id.slice(1));});},{rootMargin:'-130px 0px -65% 0px'});
  document.querySelectorAll('.year').forEach(y=>io.observe(y));
}
document.addEventListener('keydown',e=>{
  if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;
  const cur=+document.querySelector('.rail [aria-current=true]').dataset.y;
  const next=Math.min(2041,Math.max(2027,cur+(e.key==='ArrowRight'?1:-1)));
  $('y'+next).scrollIntoView({block:'start'});
});
</script>
</body>
</html>
